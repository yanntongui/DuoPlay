name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Valeur factice : le build ne doit jamais dépendre d'un backend
          # joignable (les écrans qui lisent Convex sont dynamiques).
          NEXT_PUBLIC_CONVEX_URL: https://ci-build.convex.cloud
          NEXT_PUBLIC_SITE_URL: https://duoplay.app
          ADMIN_ENABLED: "0"
