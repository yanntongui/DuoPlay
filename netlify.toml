[build]
  # Le code généré Convex (`convex/_generated/`) est versionné : le build
  # n'a pas besoin d'un déploiement Convex pour le régénérer. `convex codegen`
  # refuse volontairement `CONVEX_DEPLOY_KEY` en CI.
  #
  # Pour aussi déployer les fonctions Convex depuis Netlify, ajoutez
  # `CONVEX_DEPLOY_KEY` dans les variables d'environnement du site puis
  # remplacez la commande par :
  #   npx convex deploy --cmd 'npm run build'
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Runtime Next.js (SSR, Server Actions, middleware, images). Déclaré
# explicitement plutôt que laissé à l'auto-détection : sans lui, Netlify
# publie le dossier `.next` brut et tout le rendu serveur casse.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Le service worker doit toujours être revalidé.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité de base.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
